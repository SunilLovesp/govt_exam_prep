name: govt_exam_prep
description: Online Learning App for CGL and all Government Indian Exams
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^13.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.9
  http: ^1.2.1
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/lottie/
